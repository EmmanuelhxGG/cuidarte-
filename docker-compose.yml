services:
  cuidarteplus-postgres-et:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD}
      POSTGRES_DB: cuidarteplus
      QA_PASSWORD: ${QA_PASSWORD:?Configure QA_PASSWORD}
    ports:
      - "127.0.0.1:${PORT_POSTGRES:-15443}:5432"
    volumes:
      - postgres_qa_data:/var/lib/postgresql/data
      - ./BACKEND/sql/init.sql:/docker-entrypoint-initdb.d/00-schema.sql:ro
      - ./BACKEND/sql/seed-qa.sh:/docker-entrypoint-initdb.d/10-seed.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d cuidarteplus"]
      interval: 5s
      timeout: 3s
      retries: 15
  cuidarteplus-backend-et:
    build: ./BACKEND
    environment:
      PORT: 4000
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD}@cuidarteplus-postgres-et:5432/cuidarteplus
      JWT_SECRET: ${JWT_SECRET:?Configure JWT_SECRET}
      FRONTEND_URL: http://localhost:${PORT_FRONTEND:-3334}
    ports:
      - "127.0.0.1:${PORT_BACKEND:-4445}:4000"
    depends_on:
      cuidarteplus-postgres-et:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 15
  cuidarteplus-frontend-et:
    build:
      context: ./FRONTEND
      args:
        VITE_API_URL: http://localhost:${PORT_BACKEND:-4445}
    ports:
      - "127.0.0.1:${PORT_FRONTEND:-3334}:80"
    depends_on:
      cuidarteplus-backend-et:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 15

volumes:
  postgres_qa_data:
